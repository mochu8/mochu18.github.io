title: mochu8 的技术博客
url: https://mochu8.github.io
baseurl: ""
description: 记录编程、工具实践与持续学习。
lang: zh-CN
timezone: Asia/Shanghai
repository: mochu8/mochu8.github.io

permalink: /:year/:month/:title.html

image: /public/images/mountains.jpg
color: "#c43d36"

markdown: kramdown
highlighter: rouge
paginate: 12
paginate_path: "/page/:num/"

author:
  name: mochu8
  photo: /public/images/avatar-mochu8.jpg

socials:
  - title: GitHub
    icon: github-logo
    url: https://github.com/mochu8

compress_html:
  clippings: all
  comments: ["<!--", "-->"]
  endings: all
  startings: [html, head, body]

sass:
  sass_dir: public/css
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
