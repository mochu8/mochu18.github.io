<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Telegram Bot Token、Webhook、消息转义和内联键盘工具。">
  <meta name="theme-color" content="#176b87">
  <title>Telegram 机器人工具箱</title>
  <link rel="icon" type="image/jpeg" href="/public/images/avatar-mochu8.jpg">
  <style>
    :root {
      color-scheme: light;
      --accent: #176b87;
      --accent-dark: #0e5068;
      --background: #f4f6f8;
      --surface: #ffffff;
      --border: #d7dde2;
      --text: #182026;
      --muted: #66727c;
      --success: #247a4a;
      --error: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    a {
      color: var(--accent-dark);
    }

    .app-header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-inner,
    main,
    .site-footer {
      width: min(100% - 2rem, 880px);
      margin-inline: auto;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      gap: 1rem;
    }

    .brand {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.25;
    }

    .back-link {
      white-space: nowrap;
      font-size: .9rem;
      text-decoration: none;
    }

    main {
      padding-block: 2rem 3rem;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
    }

    .tab {
      min-height: 44px;
      padding: .6rem .75rem;
      border: 0;
      border-right: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .tab:last-child {
      border-right: 0;
    }

    .tab[aria-selected="true"] {
      color: #fff;
      background: var(--accent);
      font-weight: 600;
    }

    .tab:focus-visible,
    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid rgba(23, 107, 135, .28);
      outline-offset: 2px;
    }

    .tab-panel {
      padding: 1.5rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    .tab-panel[hidden] {
      display: none;
    }

    .tool-title {
      margin: 0 0 1.25rem;
      font-size: 1.25rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: .35rem;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: .7rem .75rem;
      border: 1px solid #aeb8c0;
      border-radius: 4px;
      color: var(--text);
      background: #fff;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-top: .5rem;
      color: var(--muted);
      font-size: .9rem;
    }

    .checkbox-row input {
      width: 1rem;
      height: 1rem;
      margin: 0;
    }

    .checkbox-row label {
      margin: 0;
      font-weight: 400;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: .65rem;
    }

    .button {
      min-height: 42px;
      padding: .55rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }

    .button:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .button.secondary {
      color: var(--accent-dark);
      background: #fff;
    }

    .result {
      display: none;
      margin-top: 1.25rem;
      padding: 1rem;
      border-left: 4px solid var(--success);
      background: #f1f8f4;
    }

    .result.show {
      display: block;
    }

    .result.error {
      border-left-color: var(--error);
      color: #7a271a;
      background: #fff3f1;
    }

    .result-title {
      margin: 0 0 .75rem;
      font-weight: 700;
    }

    .result-row {
      margin-bottom: .85rem;
    }

    .result-row:last-child {
      margin-bottom: 0;
    }

    code,
    pre {
      font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
    }

    code {
      overflow-wrap: anywhere;
    }

    pre {
      margin: .5rem 0 0;
      padding: .75rem;
      overflow: auto;
      border: 1px solid var(--border);
      background: #fff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .copy-button {
      margin-top: .55rem;
      min-height: 36px;
      padding: .35rem .7rem;
      border: 1px solid #9aa6ae;
      border-radius: 4px;
      color: var(--text);
      background: #fff;
      cursor: pointer;
    }

    .copy-button:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding-block: 1.25rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .85rem;
    }

    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      max-width: calc(100% - 2rem);
      padding: .65rem .9rem;
      border-radius: 4px;
      color: #fff;
      background: #263238;
      opacity: 0;
      transform: translateY(.5rem);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .header-inner {
        align-items: flex-start;
        flex-direction: column;
        padding-block: .8rem;
      }

      .tabs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tab:nth-child(2) {
        border-right: 0;
      }

      .tab:nth-child(-n+2) {
        border-bottom: 1px solid var(--border);
      }

      .tab-panel {
        padding: 1rem;
      }

      .site-footer {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <h1 class="brand">Telegram 机器人工具箱</h1>
      <a class="back-link" href="/projects.html">返回项目页</a>
    </div>
  </header>

  <main>
    <div class="tabs" role="tablist" aria-label="工具类型">
      <button class="tab" id="tab-token" type="button" role="tab" aria-selected="true" aria-controls="panel-token" data-panel="panel-token">Token 解析</button>
      <button class="tab" id="tab-webhook" type="button" role="tab" aria-selected="false" aria-controls="panel-webhook" data-panel="panel-webhook" tabindex="-1">Webhook</button>
      <button class="tab" id="tab-message" type="button" role="tab" aria-selected="false" aria-controls="panel-message" data-panel="panel-message" tabindex="-1">消息转义</button>
      <button class="tab" id="tab-keyboard" type="button" role="tab" aria-selected="false" aria-controls="panel-keyboard" data-panel="panel-keyboard" tabindex="-1">键盘 JSON</button>
    </div>

    <section class="tab-panel" id="panel-token" role="tabpanel" aria-labelledby="tab-token">
      <h2 class="tool-title">Bot Token 解析</h2>
      <div class="input-group">
        <label for="bot-token">Bot Token</label>
        <input type="password" id="bot-token" placeholder="123456789:ABCdefGHIjklMNOpqrsTUVwxyz" autocomplete="off" spellcheck="false">
        <div class="checkbox-row">
          <input type="checkbox" id="show-bot-token" data-toggle-password="bot-token">
          <label for="show-bot-token">显示 Token</label>
        </div>
      </div>
      <div class="actions">
        <button class="button" type="button" id="parse-token">解析 Token</button>
      </div>
      <div class="result" id="token-result" role="status" aria-live="polite"></div>
    </section>

    <section class="tab-panel" id="panel-webhook" role="tabpanel" aria-labelledby="tab-webhook" hidden>
      <h2 class="tool-title">Webhook 请求生成</h2>
      <div class="input-group">
        <label for="webhook-url">Webhook URL</label>
        <input type="url" id="webhook-url" placeholder="https://example.com/webhook" inputmode="url" autocomplete="url">
      </div>
      <div class="input-group">
        <label for="webhook-token">Bot Token</label>
        <input type="password" id="webhook-token" placeholder="123456789:ABCdefGHIjklMNOpqrsTUVwxyz" autocomplete="off" spellcheck="false">
        <div class="checkbox-row">
          <input type="checkbox" id="show-webhook-token" data-toggle-password="webhook-token">
          <label for="show-webhook-token">显示 Token</label>
        </div>
      </div>
      <div class="actions">
        <button class="button" type="button" id="build-webhook">生成请求</button>
      </div>
      <div class="result" id="webhook-result" role="status" aria-live="polite"></div>
    </section>

    <section class="tab-panel" id="panel-message" role="tabpanel" aria-labelledby="tab-message" hidden>
      <h2 class="tool-title">消息文本转义</h2>
      <div class="input-group">
        <label for="message-input">原始文本</label>
        <textarea id="message-input" placeholder="输入需要处理的文本" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="button" type="button" id="escape-markdown">MarkdownV2</button>
        <button class="button secondary" type="button" id="escape-html">HTML</button>
        <button class="button secondary" type="button" id="escape-json">JSON</button>
      </div>
      <div class="result" id="message-result" role="status" aria-live="polite"></div>
    </section>

    <section class="tab-panel" id="panel-keyboard" role="tabpanel" aria-labelledby="tab-keyboard" hidden>
      <h2 class="tool-title">内联键盘 JSON</h2>
      <div class="input-group">
        <label for="keyboard-input">按钮配置</label>
        <textarea id="keyboard-input" placeholder="按钮 1|callback_1&#10;按钮 2|callback_2" spellcheck="false"></textarea>
      </div>
      <div class="actions">
        <button class="button" type="button" id="build-keyboard">生成 JSON</button>
      </div>
      <div class="result" id="keyboard-result" role="status" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">
    <span>&copy; 2026 mochu8</span>
    <a href="https://github.com/mochu8/mochu8.github.io" target="_blank" rel="noopener noreferrer">网站源码</a>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
    const panels = Array.from(document.querySelectorAll('[role="tabpanel"]'));
    const toast = document.getElementById("toast");
    let toastTimer;

    function activateTab(tab) {
      tabs.forEach((item) => {
        const active = item === tab;
        item.setAttribute("aria-selected", String(active));
        item.tabIndex = active ? 0 : -1;
      });
      panels.forEach((panel) => {
        panel.hidden = panel.id !== tab.dataset.panel;
      });
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener("click", () => activateTab(tab));
      tab.addEventListener("keydown", (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        let nextIndex = index;
        if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
        if (event.key === 'Home') nextIndex = 0;
        if (event.key === 'End') nextIndex = tabs.length - 1;
        activateTab(tabs[nextIndex]);
        tabs[nextIndex].focus();
      });
    });

    document.querySelectorAll('[data-toggle-password]').forEach((checkbox) => {
      checkbox.addEventListener("change", () => {
        const input = document.getElementById(checkbox.dataset.togglePassword);
        input.type = checkbox.checked ? "text" : "password";
      });
    });

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("已复制");
      } catch (error) {
        showToast("复制失败，请手动选择文本");
      }
    }

    function resetResult(result, title, isError = false) {
      result.replaceChildren();
      result.className = isError ? "result show error" : "result show";
      const heading = document.createElement("p");
      heading.className = "result-title";
      heading.textContent = title;
      result.appendChild(heading);
    }

    function showError(result, message) {
      resetResult(result, message, true);
    }

    function appendTextRow(result, label, value) {
      const row = document.createElement("div");
      row.className = "result-row";
      const strong = document.createElement("strong");
      strong.textContent = label + "：";
      row.append(strong, document.createTextNode(value));
      result.appendChild(row);
    }

    function appendCodeRow(result, label, displayValue, copyValue) {
      const row = document.createElement("div");
      row.className = "result-row";
      const strong = document.createElement("strong");
      strong.textContent = label;
      const code = document.createElement("pre");
      code.textContent = displayValue;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "copy-button";
      button.textContent = "复制";
      button.addEventListener("click", () => copyText(copyValue));
      row.append(strong, code, button);
      result.appendChild(row);
    }

    function validToken(token) {
      return /^\d+:[A-Za-z0-9_-]{20,}$/.test(token);
    }

    document.getElementById("parse-token").addEventListener("click", () => {
      const token = document.getElementById("bot-token").value.trim();
      const result = document.getElementById("token-result");
      if (!validToken(token)) {
        showError(result, "Token 格式不正确");
        return;
      }
      const [botId, secret] = token.split(":", 2);
      const url = `https://api.telegram.org/bot${token}/getMe`;
      const maskedUrl = `https://api.telegram.org/bot${botId}:${secret.slice(0, 4)}.../getMe`;
      resetResult(result, "Token 格式有效");
      appendTextRow(result, "Bot ID", botId);
      appendTextRow(result, "Secret", `${secret.slice(0, 4)}...${secret.slice(-4)}`);
      appendCodeRow(result, "getMe 请求", maskedUrl, url);
    });

    document.getElementById("build-webhook").addEventListener("click", () => {
      const rawUrl = document.getElementById("webhook-url").value.trim();
      const token = document.getElementById("webhook-token").value.trim();
      const result = document.getElementById("webhook-result");
      if (!validToken(token)) {
        showError(result, "Token 格式不正确");
        return;
      }
      let webhookUrl;
      try {
        webhookUrl = new URL(rawUrl);
      } catch (error) {
        showError(result, "Webhook URL 格式不正确");
        return;
      }
      if (webhookUrl.protocol !== "https:") {
        showError(result, "Webhook URL 必须使用 HTTPS");
        return;
      }
      const base = `https://api.telegram.org/bot${token}`;
      const maskedBase = `https://api.telegram.org/bot${token.split(':')[0]}:...`;
      const requests = [
        ["设置 Webhook", `${base}/setWebhook?url=${encodeURIComponent(webhookUrl.href)}`, `${maskedBase}/setWebhook?url=${encodeURIComponent(webhookUrl.href)}`],
        ["查看 Webhook", `${base}/getWebhookInfo`, `${maskedBase}/getWebhookInfo`],
        ["删除 Webhook", `${base}/deleteWebhook`, `${maskedBase}/deleteWebhook`]
      ];
      resetResult(result, "请求已生成");
      requests.forEach(([label, value, display]) => appendCodeRow(result, label, display, value));
    });

    function renderMessageResult(label, value) {
      const result = document.getElementById("message-result");
      if (!document.getElementById("message-input").value) {
        showError(result, "请输入需要处理的文本");
        return;
      }
      resetResult(result, label);
      appendCodeRow(result, "结果", value, value);
    }

    document.getElementById("escape-markdown").addEventListener("click", () => {
      const value = document.getElementById("message-input").value.replace(/([_*\[\]()~`>#+\-=|{}.!])/g, "\\$1");
      renderMessageResult("MarkdownV2 转义完成", value);
    });

    document.getElementById("escape-html").addEventListener("click", () => {
      const value = document.getElementById("message-input").value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;");
      renderMessageResult("HTML 转义完成", value);
    });

    document.getElementById("escape-json").addEventListener("click", () => {
      const value = JSON.stringify(document.getElementById("message-input").value);
      renderMessageResult("JSON 转义完成", value);
    });

    document.getElementById("build-keyboard").addEventListener("click", () => {
      const raw = document.getElementById("keyboard-input").value.trim();
      const result = document.getElementById("keyboard-result");
      if (!raw) {
        showError(result, "请输入按钮配置");
        return;
      }
      const rows = [];
      for (const line of raw.split(/\r?\n/)) {
        if (!line.trim()) continue;
        const separator = line.indexOf("|");
        if (separator < 1 || separator === line.length - 1) {
          showError(result, `配置格式不正确：${line}`);
          return;
        }
        const text = line.slice(0, separator).trim();
        const callbackData = line.slice(separator + 1).trim();
        if (new TextEncoder().encode(callbackData).length > 64) {
          showError(result, `回调数据超过 64 字节：${text}`);
          return;
        }
        rows.push([{ text, callback_data: callbackData }]);
      }
      const value = JSON.stringify({ inline_keyboard: rows }, null, 2);
      resetResult(result, "键盘 JSON 已生成");
      appendCodeRow(result, "结果", value, value);
    });
  </script>
</body>
</html>
